services:
  - type: web
    name: sales-engine-backend
    runtime: node
    rootDir: backendZip
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      # Same value as BACKEND_API_KEY in the Vercel project (set in the Render dashboard).
      - key: BACKEND_API_KEY
        sync: false
